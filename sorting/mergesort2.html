 <script>
var canvas = document.getElementById("mycanvas");
var context = canvas.getContext("2d");
var seq=Array(9,18,12,14,16,13,6,3,8,0,4,2,11,17,10,15,5,19,1,7);   
async function mergesort(seq) {
       n=seq.length;
       //console.log("n",n);
       t=n;k=1;
       //console.log(n,t,k);
       for(x=0;x<n;x++){seq.push(-0.5);}
       //console.log(seq);
  async function loop() {
      async function loopi() {
	  seq[k]=seq[i];await draw(seq,i,j,k,l);await sleep(500);
	  i=i+1;k=k+s;
	   if (seq[i-1]<seq[i]){await loopi();}}
      async function loopj() {
	  seq[k]=seq[j];await draw(seq,i,j,k,l);await sleep(500);
	  j=j-1;k=k+s;
	   if (seq[j+1]<seq[j]){await loopj();}}
       while(i<=j) {//console.log('loop',i,j,k,l,s,seq.slice(0,n),seq.slice(n,2*n));
	   if(seq[i]<=seq[j]) {
	       seq[k]=seq[i];await draw(seq,i,j,k,l);await sleep(500);
	       i=i+1;k=k+s;
	       if (seq[i-1]<seq[i]) {await loop();}
	       else if(i<j) {await loopj();}}
            else{
		seq[k]=seq[j];await draw(seq,i,j,k,l);await sleep(500);
		j=j-1;k=k+s;
		  if (seq[j]>seq[j+1]) {await loop();}
		  else if(i<j){await loopi();}}
		    x=k;k=l;l=x;s=-s;}}
   while(k%n!=0) {
       k=t;l=k+n-1;t=n-t;i=t;j=i+n-1;s=1;
       while(i<j){await loop();}}
   return seq.slice(k-n,k);}

    function sleep(msec){
    return new Promise(resolve => setTimeout(resolve, msec));}
   function drawseq(x,y,seq) {
    context.save();
    context.translate(x,y);
    context.strokeStyle="#000000";
    context.strokeRect (0,0,400,-200);
    context.fillStyle="#00008b";
       for (var l=0;l<20;l++) {
	   context.fillRect((l+0.2)*20,0,12,-10*seq[l]-5);}
			    context.restore();}
   function draw(seq,i,j,k,l) {
    context.clearRect(0,0,500,500);
	context.font = "20px serif"
        context.fillStyle="#000000";
        context.textAlign = "center";
        drawseq(50,250,seq.slice(0,20));
        drawseq(50,450,seq.slice(20,40));
       	context.font = "30px serif"
       context.fillText("i",(i%20+(i==j?2.8:3))*20,i<20?40:480);
       context.fillText("j",(j%20+(i==j?3.2:3))*20,j<20?40:480);
       context.fillText("k",(k%20+(k==l?2.8:3))*20,k<20?40:480);
       context.fillText("l",(l%20+(k==l?3.2:3))*20,l<20?40:480);

   }

   temp=mergesort(seq);
