    m16 = (1<<16)-1;
    function bb(n,x,s) {
        if(((n | x) | s) > 0){
	a=n & s;b=n ^ s;c=x ^ b;d=c >> 1;c=c << 1;e=c ^ d;c=c & d;
	f=(b & e) | c;e=b ^ e;c=(x & b) | a;b=c << 1;c=c >> 1;
	d=b & c; c=c | b;b= a & f;f=(a | f) | d;c=b | c;f=f ^ c;
	    e=e | x;f= f & e;return(f)}
	else{return 0}}
    function bs(bgn, bgc, bgs){
	return([bb(bgn[0],bgc[0],bgs[0]),
                bb(bgn[1],bgc[1],bgs[1]),
                bb(bgn[2],bgc[2],bgs[2]),
		bb(bgn[3],bgc[3],bgs[3]),
		bb(bgn[4],bgc[4],bgs[4]),
                bb(bgn[5],bgc[5],bgs[5]),
                bb(bgn[6],bgc[6],bgs[6]),
		bb(bgn[7],bgc[7],bgs[7])]);}
    function addside(gi){
        
	gi0=gi[0];gi1=gi[1];gi2=gi[2];gi3=gi[3];
	gi4=gi[4];gi5=gi[5];gi6=gi[6];gi7=gi[7];
	fi0=              (gi0<<1)+((gi1>>15)&1);
	fi1=((gi0&1)<<17)+(gi1<<1)+((gi2>>15)&1);
	fi2=((gi1&1)<<17)+(gi2<<1)+((gi3>>15)&1);
	fi3=((gi2&1)<<17)+(gi3<<1)+((gi4>>15)&1);
	fi4=((gi3&1)<<17)+(gi4<<1)+((gi5>>15)&1);
	fi5=((gi4&1)<<17)+(gi5<<1)+((gi6>>15)&1);
	fi6=((gi5&1)<<17)+(gi6<<1)+((gi7>>15)&1);
	fi7=((gi6&1)<<17)+(gi7<<1);
 	return([fi0,fi1,fi2,fi3,fi4,fi5,fi6,fi7])}
    function subside(fi){
	return(
	    [(fi[0]>>1)&m16,
	     (fi[1]>>1)&m16,
	     (fi[2]>>1)&m16,
	     (fi[3]>>1)&m16,
	     (fi[4]>>1)&m16,
	     (fi[5]>>1)&m16,
	     (fi[6]>>1)&m16,
	     (fi[7]>>1)&m16]);}
     function advance(gg){
	var ff=new Array(128);
	 gn=[0,0,0,0,0,0,0,0];
	gc=addside(gg[0]);
	for(var i=0;i<127;i++){
	    gs=addside(gg[i+1]);
	    ff[i]=subside(bs(gn,gc,gs));
	    gn=gc;gc=gs;}
	 gs=[0,0,0,0,0,0,0,0];
	ff[127]=subside(bs(gn,gc,gs));
	return(ff);}
